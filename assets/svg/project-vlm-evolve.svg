<svg xmlns="http://www.w3.org/2000/svg" width="410" height="210" viewBox="0 0 410 210" role="img" aria-label="Evolutionary VLM Inference: LLM-driven evolutionary search, inspired by AlphaEvolve, that rewrites inference code from failed examples to improve frozen Vision-Language Models without retraining."><style>.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;font-weight:700;letter-spacing:1.6px}.h{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:800}.t{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:700}.s{font-family:'Segoe UI',Inter,-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;font-weight:500}</style><defs><linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs><rect x="0.5" y="0.5" width="409" height="209" rx="14" fill="#0c0a14" stroke="rgba(255,255,255,0.09)"/><rect x="1" y="1" width="408" height="4" rx="2" fill="url(#t)"/><text class="m" x="20" y="34" fill="#2dd4bf" font-size="10">RESEARCH</text><text class="t" x="20" y="62" fill="#f5f3ff" font-size="20">Evolutionary VLM Inference</text><text class="s" x="20" y="88" fill="rgba(255,255,255,0.72)" font-size="12.5">LLM-driven evolutionary search, inspired by AlphaEvolve,</text><text class="s" x="20" y="106" fill="rgba(255,255,255,0.72)" font-size="12.5">that rewrites inference code from failed examples to</text><text class="s" x="20" y="124" fill="rgba(255,255,255,0.72)" font-size="12.5">improve frozen Vision-Language Models without</text><text class="s" x="20" y="142" fill="rgba(255,255,255,0.72)" font-size="12.5">retraining.</text><text class="m" x="20" y="162" fill="#a78bfa" font-size="10.5" letter-spacing="0.6">&#9656; 16.6% to 41.3% exact match, 3.8x faster</text><rect x="20" y="174" width="57" height="23" rx="11.5" fill="#a78bfa1a" stroke="#a78bfa55"/><text class="